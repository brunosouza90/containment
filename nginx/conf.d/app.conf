# Importa o módulo NJS
js_import /etc/nginx/njs/status.js;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Rota para consultar o estado atual (JSON)
    location /status {
        js_content status.statusJson;
    }

    # Rota para alterar o estado (ex: /set?value=true)
    location /set {
        js_content status.setStatus;
    }

    # Rota principal – aplica a contenção
    location / {
        # Obtém o estado via NJS
        js_set $contencao_status status.getStatus;

        # Se contenção ativa, retorna 503 (página de erro)
        if ($contencao_status = 'true') {
            return 503;
        }

        # Caso contrário, proxy para o backend (exemplo: httpbin)
        try_files /login.html =404;
    }

    # Página de erro personalizada para 503 (contenção)
    error_page 503 /contencao.html;
    location = /contencao.html {
        root /usr/share/nginx/html;
        internal;
    }
}